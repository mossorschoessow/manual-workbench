<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<meta name="mobile-web-app-capable" content="yes">
<title>維修手冊工作臺</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="appbar">
  <h1 id="pageTitle" data-i18n="app.title">維修手冊工作臺</h1>
</header>

<main>
  <!-- ========== 工作臺：型號查詢 ========== -->
  <section id="view-search" class="view active">
    <div class="search-wrap">
      <div class="search-box">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" data-i18n-ph="search.ph" data-i18n-aria="search.aria" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
        <button id="clearQ" class="icon-btn" type="button" hidden data-i18n-aria="search.clear">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button id="scanBtn" class="icon-btn" type="button" hidden data-i18n-aria="search.scan">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
        </button>
      </div>
      <div id="searchMeta" class="meta-line"></div>
    </div>

    <div id="results" class="list"></div>

    <div id="home">
      <div id="emptyLib" class="empty" hidden>
        <p data-i18n="home.empty1"></p>
        <p class="muted" data-i18n="home.empty2"></p>
        <button class="btn primary" type="button" data-goto="library" data-i18n="home.goAdd"></button>
      </div>
      <div id="favWrap" hidden>
        <h2 class="section-h" data-i18n="home.favs"></h2>
        <div id="favList" class="list"></div>
      </div>
      <div id="recentWrap" hidden>
        <h2 class="section-h" data-i18n="home.recent"></h2>
        <div id="recentList" class="list"></div>
      </div>
      <div id="recentExpWrap" hidden>
        <h2 class="section-h" data-i18n="home.recentExp"></h2>
        <div id="recentExpList" class="list"></div>
      </div>
    </div>
  </section>

  <!-- ========== 手冊庫 ========== -->
  <section id="view-library" class="view">
    <div class="filters">
      <select id="fltBrand" data-i18n-aria="lib.byBrand"><option value=""></option></select>
      <select id="fltDept" data-i18n-aria="lib.byDept"><option value=""></option></select>
      <select id="fltSort" data-i18n-aria="lib.sort">
        <option value="title" data-i18n="lib.sortTitle"></option>
        <option value="updated" data-i18n="lib.sortUpdated"></option>
      </select>
    </div>
    <div id="libMeta" class="meta-line"></div>
    <div id="libList" class="list"></div>
    <button class="fab" id="addBtn" type="button">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="lib.add"></span>
    </button>
  </section>

  <!-- ========== 設置 ========== -->
  <section id="view-settings" class="view">
    <div class="panel">
      <h2 id="langHeading"></h2>
      <select id="langSelect" class="lang-select" aria-label="Language"></select>
    </div>

    <div class="panel">
      <h2 data-i18n="set.storage"></h2>
      <div id="storageInfo" class="kv-list"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="set.batch"></h2>
      <p class="muted" data-i18n="set.batchDesc"></p>
      <ul class="rules">
        <li data-i18n-html="set.batchRule1Html"></li>
        <li data-i18n-html="set.batchRule2Html"></li>
      </ul>
      <button class="btn primary block" type="button" id="batchBtn" data-i18n="set.batchBtn"></button>
      <input type="file" id="batchInput" multiple hidden>
    </div>

    <div class="panel">
      <h2 data-i18n="set.backup"></h2>
      <p class="muted" data-i18n-html="set.backupDescHtml"></p>
      <div class="btn-row">
        <button class="btn" type="button" id="exportBtn" data-i18n="set.export"></button>
        <button class="btn" type="button" id="importBtn" data-i18n="set.import"></button>
      </div>
      <input type="file" id="importInput" accept=".manlib" hidden>
    </div>

    <div class="panel">
      <h2 data-i18n="set.tips"></h2>
      <ul class="rules">
        <li data-i18n-html="set.tip1Html"></li>
        <li data-i18n-html="set.tip2Html"></li>
        <li data-i18n-html="set.tip3Html"></li>
        <li data-i18n-html="set.tip4Html"></li>
      </ul>
    </div>
    <p class="muted center small" id="versionInfo"></p>
  </section>
</main>

<nav class="tabbar">
  <button type="button" class="tab active" data-view="search">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-i18n="tab.search"></span>
  </button>
  <button type="button" class="tab" data-view="library">
    <svg class="ico" viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg><span data-i18n="tab.library"></span>
  </button>
  <button type="button" class="tab" data-view="settings">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span data-i18n="tab.settings"></span>
  </button>
</nav>

<!-- ========== 新增 / 編輯 ========== -->
<div id="editSheet" class="overlay sheet-wrap" hidden>
  <form class="sheet" id="editForm" novalidate>
    <div class="sheet-head">
      <button type="button" class="icon-btn" data-close data-i18n-aria="edit.close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="editTitle"></h2>
      <button type="submit" class="btn primary sm" id="saveBtn" data-i18n="edit.save"></button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <span class="label"><span data-i18n="edit.file"></span> <em>*</em></span>
        <div class="file-pick">
          <button type="button" id="pickFile" class="btn sm" data-i18n="edit.pick"></button>
          <span id="fileInfo" class="muted"></span>
        </div>
        <input type="file" id="fileInput" hidden>
      </div>
      <label class="field">
        <span class="label"><span data-i18n="edit.models"></span> <em>*</em></span>
        <textarea id="fModels" rows="2" data-i18n-ph="edit.modelsPh"></textarea>
        <small class="muted" data-i18n="edit.modelsHint"></small>
      </label>
      <label class="field">
        <span class="label" data-i18n="edit.titleLabel"></span>
        <input id="fTitle" data-i18n-ph="edit.titlePh">
      </label>
      <div class="row2">
        <label class="field"><span class="label" data-i18n="edit.brand"></span><input id="fBrand" list="brandList"></label>
        <label class="field"><span class="label" data-i18n="edit.device"></span><input id="fDevice" list="deviceList" data-i18n-ph="edit.devicePh"></label>
      </div>
      <label class="field"><span class="label" data-i18n="edit.dept"></span><input id="fDept" list="deptList"></label>
      <label class="field"><span class="label" data-i18n="edit.notes"></span><textarea id="fNotes" rows="2" data-i18n-ph="edit.notesPh"></textarea></label>
      <button type="button" id="deleteBtn" class="btn danger block" hidden data-i18n="edit.delete"></button>
    </div>
  </form>
</div>
<datalist id="brandList"></datalist>
<datalist id="deviceList"></datalist>
<datalist id="deptList"></datalist>

<!-- ========== 閱讀器 ========== -->
<div id="viewer" class="overlay viewer" hidden>
  <div class="vbar">
    <button type="button" class="icon-btn" data-close data-i18n-aria="v.back">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="vtitle" id="vTitle"></div>
    <button type="button" class="icon-btn vexp" id="vExpBtn" data-i18n-aria="exp.title">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span class="badge" id="vExpCount" hidden></span>
    </button>
    <button type="button" class="icon-btn" id="vFindBtn" data-i18n-aria="v.find">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button type="button" class="icon-btn" id="vMoreBtn" data-i18n-aria="v.more">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
    </button>
  </div>
  <div class="vmenu" id="vMenu" hidden>
    <button type="button" id="vShare" data-i18n="v.share"></button>
    <button type="button" id="vInfo" data-i18n="v.info"></button>
  </div>
  <form class="vfind" id="vFindBar" hidden>
    <input id="vFindInput" type="search" data-i18n-ph="v.findPh" enterkeyhint="search" autocomplete="off" spellcheck="false">
    <button type="submit" class="btn primary sm" data-i18n="v.findGo"></button>
  </form>
  <div class="vfind-results" id="vFindResults" hidden></div>
  <div class="vbody" id="vBody"><div class="pages" id="vPages"></div></div>
  <div class="vfoot" id="vFoot">
    <button type="button" class="icon-btn" id="zOut" data-i18n-aria="v.zoomOut"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button type="button" class="btn sm ghost" id="zFit" data-i18n="v.fit"></button>
    <button type="button" class="icon-btn" id="zIn" data-i18n-aria="v.zoomIn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" class="page-ind" id="pageInd" data-i18n-aria="v.jumpAria">– / –</button>
  </div>
</div>

<!-- ========== 維修經驗 ========== -->
<div id="expSheet" class="overlay sheet-wrap" hidden>
  <div class="sheet tall">
    <div class="sheet-head">
      <button type="button" class="icon-btn" data-close data-i18n-aria="edit.close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="sheet-title">
        <h2 data-i18n="exp.title"></h2>
        <div class="sheet-sub" id="expSub"></div>
      </div>
      <button type="button" class="btn primary sm" id="expAddBtn" data-i18n="exp.add"></button>
    </div>
    <div class="exp-filter" id="expFilterWrap">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="expFilter" type="search" data-i18n-ph="exp.filterPh" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="sheet-body" id="expBody"></div>
  </div>
</div>

<div id="expEdit" class="overlay sheet-wrap" hidden>
  <form class="sheet" id="expForm" novalidate>
    <div class="sheet-head">
      <button type="button" class="icon-btn" data-close data-i18n-aria="edit.close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="expEditTitle"></h2>
      <button type="submit" class="btn primary sm" id="expSaveBtn" data-i18n="edit.save"></button>
    </div>
    <div class="sheet-body">
      <label class="field">
        <span class="label"><span data-i18n="exp.item"></span> <em>*</em></span>
        <input id="xItem" list="expItemList" data-i18n-ph="exp.itemPh" autocomplete="off">
        <small class="muted" data-i18n="exp.itemHint"></small>
      </label>
      <div class="field">
        <span class="label" data-i18n="exp.result"></span>
        <div class="seg">
          <label><input type="radio" name="xResult" value="ok" checked><span data-i18n="exp.ok"></span></label>
          <label><input type="radio" name="xResult" value="partial"><span data-i18n="exp.partial"></span></label>
          <label><input type="radio" name="xResult" value="fail"><span data-i18n="exp.fail"></span></label>
        </div>
      </div>
      <label class="field">
        <span class="label"><span data-i18n="exp.content"></span> <em>*</em></span>
        <textarea id="xContent" rows="6" data-i18n-ph="exp.contentPh"></textarea>
      </label>
      <div class="row2">
        <label class="field"><span class="label" data-i18n="exp.date"></span><input id="xDate" type="date"></label>
        <label class="field"><span class="label" data-i18n="exp.author"></span><input id="xAuthor" data-i18n-ph="exp.authorPh" autocomplete="name"></label>
      </div>
      <button type="button" id="xDelete" class="btn danger block" hidden data-i18n="exp.delete"></button>
    </div>
  </form>
</div>
<datalist id="expItemList"></datalist>

<!-- ========== 掃碼 ========== -->
<div id="scanner" class="overlay scanner" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div class="scan-frame"></div>
  <p class="scan-tip" data-i18n="scan.tip"></p>
  <button type="button" class="btn block" data-close data-i18n="scan.cancel"></button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
